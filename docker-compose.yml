version: '3.8'

services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: api_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - nexus-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== BACKEND SERVICES ====================
  auth-service:
    build: ./auth-service
    container_name: nexus-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjIwMjQ=
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

  # User Service - Instance 1
  user-service-1:
    build: ./user-service
    container_name: nexus-user-1
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

  # User Service - Instance 2
  user-service-2:
    build: ./user-service
    container_name: nexus-user-2
    ports:
      - "8092:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

  # Payment Service - Instance 1
  payment-service-1:
    build: ./payment-service
    container_name: nexus-payment-1
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

  # Payment Service - Instance 2
  payment-service-2:
    build: ./payment-service
    container_name: nexus-payment-2
    ports:
      - "8093:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

  # Notification Service - Instance 1
  notification-service-1:
    build: ./notification-service
    container_name: nexus-notification-1
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

  # Notification Service - Instance 2
  notification-service-2:
    build: ./notification-service
    container_name: nexus-notification-2
    ports:
      - "8094:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

  log-consumer-service:
    build: ./log-consumer-service
    container_name: nexus-log-consumer
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-network

  # ==================== PYTHON ML SERVICE ====================
  ml-service:
    build: ./ml-service
    container_name: nexus-ml-service
    ports:
      - "8000:8000"
    networks:
      - nexus-network

  # ==================== API GATEWAY ====================
  gateway-service:
    build: ./gateway-service
    container_name: nexus-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjIwMjQ=
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service-1:8082
      PAYMENT_SERVICE_URL: http://payment-service-1:8083
      NOTIFICATION_SERVICE_URL: http://notification-service-1:8084
      LOG_CONSUMER_SERVICE_URL: http://log-consumer-service:8085
      USER_SERVICE_1_URL: http://user-service-1:8082
      USER_SERVICE_2_URL: http://user-service-2:8082
      PAYMENT_SERVICE_1_URL: http://payment-service-1:8083
      PAYMENT_SERVICE_2_URL: http://payment-service-2:8083
      NOTIFICATION_SERVICE_1_URL: http://notification-service-1:8084
      NOTIFICATION_SERVICE_2_URL: http://notification-service-2:8084
    depends_on:
      - auth-service
      - user-service-1
      - user-service-2
      - payment-service-1
      - payment-service-2
      - notification-service-1
      - notification-service-2
      - log-consumer-service
      - redis
      - kafka
    networks:
      - nexus-network

  # ==================== FRONTEND DASHBOARD ====================
  frontend:
    build: ./frontend
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway-service
    networks:
      - nexus-network

  # ==================== MONITORING ====================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: nexus-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway-service
    networks:
      - nexus-network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: nexus-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - nexus-network

volumes:
  postgres_data:

networks:
  nexus-network:
    driver: bridge
