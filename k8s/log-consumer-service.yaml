apiVersion: v1
kind: Service
metadata:
  name: log-consumer-service
  labels:
    app: log-consumer-service
    app.kubernetes.io/part-of: nexus-gateway
spec:
  ports:
    - port: 8085
      targetPort: 8085
  selector:
    app: log-consumer-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-consumer-service
  labels:
    app: log-consumer-service
    app.kubernetes.io/part-of: nexus-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-consumer-service
  template:
    metadata:
      labels:
        app: log-consumer-service
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: log-consumer-service
          image: nexus-log-consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/api_management?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: MYSQL_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: MYSQL_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: REDIS_HOST
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 15
