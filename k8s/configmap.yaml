apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  labels:
    app.kubernetes.io/part-of: nexus-gateway
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: api_management
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ZOOKEEPER_CONNECT: zookeeper:2181
  AUTH_SERVICE_URL: http://auth-service:8081
  USER_SERVICE_URL: http://user-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  NOTIFICATION_SERVICE_URL: http://notification-service:8084
  LOG_CONSUMER_SERVICE_URL: http://log-consumer-service:8085
  RATE_LIMIT_RPM: "100"
